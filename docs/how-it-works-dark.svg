<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 350" width="1100" height="350" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d"><title id="t">How a ballast run is checked against a locked spec</title><desc id="d">A spec is locked once and its hash is stamped on every node record. At every agent node the worker polls for a new spec, scores the node, probes the claim if the score was clean, then responds: it injects a correction for drift, or sends an irreversible tool through Broker and CEO and stops the run if neither resolves it.</desc>
<path d="M30 110H1062" stroke="#7d8590" stroke-width="2.5" fill="none"/><path d="M1056 103L1070 110L1056 117Z" fill="#7d8590"/>
<path d="M930 110V42H320V100" stroke="#7d8590" stroke-width="1.5" stroke-dasharray="5 5" fill="none"/><path d="M313 96L320 108L327 96Z" fill="#7d8590"/><text x="625" y="32" font-size="17" text-anchor="middle" fill="#9198a1">next node</text>
<circle cx="30" cy="110" r="6" fill="#7d8590"/>
<text x="30" y="82" font-size="22" font-weight="600" fill="#e6edf3">spec.md</text>
<text x="30" y="138" font-size="17" fill="#9198a1">intent, criteria,</text>
<text x="30" y="160" font-size="17" fill="#9198a1">constraints</text>
<path d="M215 110V128" stroke="#58a6ff" stroke-width="3"/><path d="M198 128H232L241 162H189Z" fill="#58a6ff"/><circle cx="215" cy="110" r="7" fill="#58a6ff"/>
<text x="215" y="82" font-size="22" font-weight="600" fill="#e6edf3">lock()</text>
<circle cx="320" cy="110" r="6" fill="#7d8590"/>
<text x="320" y="82" font-size="22" font-weight="600" fill="#e6edf3">poll</text>
<text x="320" y="138" font-size="17" fill="#9198a1">new hash?</text>
<text x="320" y="160" font-size="17" fill="#9198a1">inject the diff</text>
<circle cx="470" cy="110" r="6" fill="#7d8590"/>
<text x="470" y="82" font-size="22" font-weight="600" fill="#e6edf3">score</text>
<text x="470" y="138" font-size="17" fill="#9198a1">tool rule + 2 LLM</text>
<text x="470" y="160" font-size="17" fill="#9198a1">judges, take min</text>
<circle cx="620" cy="110" r="6" fill="#7d8590"/>
<text x="620" y="82" font-size="22" font-weight="600" fill="#e6edf3">probe</text>
<text x="620" y="138" font-size="17" fill="#9198a1">only if the</text>
<text x="620" y="160" font-size="17" fill="#9198a1">score was clean</text>
<circle cx="770" cy="110" r="6" fill="#7d8590"/>
<text x="770" y="82" font-size="22" font-weight="600" fill="#e6edf3">respond</text>
<circle cx="930" cy="110" r="6" fill="#7d8590"/>
<text x="930" y="82" font-size="22" font-weight="600" fill="#e6edf3">checkpoint</text>
<text x="930" y="138" font-size="17" fill="#9198a1">every 10 nodes</text>
<text x="930" y="160" font-size="17" fill="#9198a1">by default</text>
<text x="30" y="212" font-size="17" fill="#9198a1">16-char hash of the locked spec</text><text x="30" y="234" font-size="17" fill="#9198a1">is stamped on every node record</text>
<path d="M770 110V222q0 8 8 8H788" stroke="#7d8590" stroke-width="1.5" fill="none"/><path d="M770 110V296q0 8 8 8H788" stroke="#7d8590" stroke-width="1.5" fill="none"/>
<text x="798" y="228" font-size="18" fill="#e6edf3">Score under threshold: inject</text>
<text x="798" y="250" font-size="18" fill="#e6edf3">a correction, the run goes on</text>
<text x="798" y="296" font-size="18" fill="#e6edf3">Irreversible tool: Broker, then</text>
<text x="798" y="318" font-size="18" fill="#e6edf3">CEO (both Haiku). Unresolved:</text>
<text x="798" y="340" font-size="18" fill="#e6edf3">HardInterrupt, the run stops</text>
</svg>
